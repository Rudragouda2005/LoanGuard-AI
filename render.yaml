services:
  - type: web
    name: loanguard-ai
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm ci --no-audit --no-fund && npm run build && cd ..
      python -m backend.ml_pipeline
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LOANGUARD_ENV
        value: production
      - key: LOANGUARD_DB_PATH
        value: data/loanguard.db
      - key: LOANGUARD_MODEL_DIR
        value: models
      - key: LOANGUARD_REVIEWER_TOKEN
        generateValue: true
      - key: LOANGUARD_CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
